name = "ai-agents-system"
main = "src/index.ts"
compatibility_date = "2024-05-24"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "AGENT_DB"
database_name = "ai-agents-db"
database_id = "placeholder-replace-with-real-id"

[vars]
ENVIRONMENT = "development"

# Secrets (set via `wrangler secret put`):
# TELEGRAM_BOT_TOKEN
# TELEGRAM_CHAT_ID
# OPENAI_API_KEY
# WB_API_TOKEN
# GOOGLE_SERVICE_ACCOUNT_JSON
